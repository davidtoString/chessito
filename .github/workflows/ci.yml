name: Validate Chessito

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:repository
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:production
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate Docker configuration
        env:
          CHESSITO_PASSWORD: ci-only-password-not-for-deployment
          CHESSITO_DOMAIN: chess.companyapps.xyz
          CHESSITO_RELEASE: ci
          CHESSITO_PROXY_NETWORK: ci-proxy
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.production.yaml config --quiet
          docker compose -f compose.vps.yaml config --quiet
          docker compose -f compose.vps.yaml -f compose.vps-build.yaml config --quiet
          bash -n deploy/ops.sh deploy/export-images.sh
